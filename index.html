<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Business Dashboard</title>
    <!-- Here is the CDN link that pipes in Tailwind CSS for free! -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<!-- The body is what actually shows up on the screen. 
     We are giving it a light gray background (bg-gray-100). -->
<body class="bg-gray-100 text-gray-800 font-sans">
    
    <div class="p-8">
        <!-- text-3xl makes the text big, text-blue-600 makes it blue -->
        <h1 class="text-3xl font-bold text-blue-600">My AI Dashboard</h1>
        <p class="mt-2 text-gray-600">Welcome to the control center.</p>
    </div>

</body>
</html>
